name: Release

# Push a tag like v0.1.0 to publish the package to npm and attach the tarball to
# a GitHub Release.
#
# npm publishes with the NPM_TOKEN secret for now: npm's trusted publishing
# rejects GitHub's immutable OIDC subjects, which this repo (created after
# 2026-07-15) gets (npm/cli#9969). The job has no id-token permission because
# npm prefers OIDC whenever it can get a token, and ignores NODE_AUTH_TOKEN.
# Once npm/cli#9969 is fixed, restore `id-token: write` (trusted publishing and
# provenance) and drop NODE_AUTH_TOKEN.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm pack
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish meirakrish-llm-kit-*.tgz --access public
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" meirakrish-llm-kit-*.tgz --title "$GITHUB_REF_NAME" --generate-notes
