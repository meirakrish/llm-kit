name: Release

# Push a tag like v0.1.0 to build the package and attach it to a GitHub Release.
# Projects install the release tarball, which ships the compiled dist/, so they
# need no build step (and no pnpm allowBuilds entry) and no npm registry.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm pack
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" meirakrish-llm-kit-*.tgz --title "$GITHUB_REF_NAME" --generate-notes
